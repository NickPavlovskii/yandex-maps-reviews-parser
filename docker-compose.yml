services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started
    networks:
      - app

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/var/www/html
    environment: &php-env
      APP_NAME: App
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_LOCALE: ru
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:5173,localhost:8080,127.0.0.1:5173,127.0.0.1:8080}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: app
      DB_USERNAME: app
      DB_PASSWORD: secret
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PASSWORD: ""
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      PARSER_URL: http://parser:3000
      PARSER_TIMEOUT: "300"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      parser:
        condition: service_healthy
    networks:
      - app

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    entrypoint: ["/usr/local/bin/queue-entrypoint.sh"]
    volumes:
      - ./backend:/var/www/html
    environment:
      <<: *php-env
    depends_on:
      php:
        condition: service_started
      redis:
        condition: service_healthy
      parser:
        condition: service_healthy
    networks:
      - app

  parser:
    build:
      context: ./backend/parser
      dockerfile: Dockerfile
    user: root
    shm_size: "1gb"
    volumes:
      - ./backend/parser:/app
      - parser_node_modules:/app/node_modules
    environment:
      PORT: "3000"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    command: sh -c "if [ ! -d node_modules/playwright ]; then npm ci --omit=dev; fi && node server.js"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - app

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - app

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY: http://nginx:80
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - nginx
    networks:
      - app

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  parser_node_modules:

networks:
  app:
    driver: bridge
